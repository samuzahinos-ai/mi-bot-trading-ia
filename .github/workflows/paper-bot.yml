name: Bot paper trading cada 5 minutos

# Disparadores:
#  - repository_dispatch "tick": lo envía un programador externo gratuito (cron-job.org) cada 5 minutos.
#    Es el disparador FIABLE. Ver LEEME_24-7.md.
#  - schedule: respaldo. GitHub retrasa u omite muchas ejecuciones programadas en repos pequeños,
#    por eso no se puede depender solo de él.
#  - workflow_dispatch: ejecución manual; es la única que puede pausar o reanudar nuevas entradas.
#  - push: ejecuta pruebas y un ciclo cuando cambia el código del motor.
on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "paper_engine.py"
      - "worker.py"
      - "tests/**"
      - "requirements-worker.txt"
      - ".github/workflows/paper-bot.yml"
  repository_dispatch:
    types: [tick]
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      allow_entries:
        description: "Permitir nuevas compras simuladas (la gestión de posiciones abiertas continúa aunque se desactive)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

# Un solo ciclo a la vez. Si llegan varios disparos juntos, GitHub conserva solo el último en cola.
concurrency:
  group: paper-trading-worker
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias del motor
        run: python -m pip install -r requirements-worker.txt
      - name: Comprobar sintaxis
        run: python -m py_compile app.py paper_engine.py worker.py
      - name: Ejecutar pruebas del motor
        run: python -m unittest discover -s tests -v

  run-paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-worker.txt

      - name: Instalar motor
        run: python -m pip install -r requirements-worker.txt

      - name: Recuperar estado de la cuenta ficticia
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin bot-state
            git show origin/bot-state:paper_state.json > paper_state.json
          fi

      - name: Ejecutar un ciclo de simulación
        env:
          EXCHANGE_ID: kraken
          # Solo una ejecución manual puede cambiar el interruptor persistente de nuevas entradas.
          SET_BOT_ENABLED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          BOT_ENABLED_INPUT: ${{ inputs.allow_entries }}
          PYTHONUNBUFFERED: "1"
        run: python worker.py

      - name: Guardar estado sin acumular historial de commits
        shell: bash
        run: |
          cp paper_state.json "$RUNNER_TEMP/paper_state.json"
          git checkout --orphan paper-state-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/paper_state.json" paper_state.json
          git add -f paper_state.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Actualizar estado de paper trading"
          for attempt in 1 2 3; do
            if git push --force origin HEAD:bot-state; then
              exit 0
            fi
            echo "Intento $attempt de guardar el estado falló; reintentando..."
            sleep 5
          done
          echo "::error::No se pudo guardar el estado en la rama bot-state."
          exit 1
